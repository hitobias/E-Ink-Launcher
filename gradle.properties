# Project-wide Gradle settings.
# https://www.gradle.org/docs/current/userguide/build_environment.html

# AndroidX is mandatory on modern toolchains.
android.useAndroidX=true

# Kotlin is intentionally disabled — the project is pure Java.
android.builtInKotlin=false

# Reasonable JVM defaults for the daemon.
org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Generate non-final R fields so feature modules / split APKs behave consistently.
android.nonFinalResIds=true
android.nonTransitiveRClass=true
