name: Feature request
description: Suggest an idea or improvement
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem you're trying to solve
      description: What's missing or annoying? Why does it matter?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to behave? What does the UI/UX look like?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you currently use, or other approaches you thought about.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I'm happy with this being e-ink-only behavior
        - label: This needs to work on non-e-ink Android too
        - label: I'd be willing to send a PR
