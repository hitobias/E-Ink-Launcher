name: Build APK

on:
  push:
    branches:
      - v0.x
      - master
      - main
  pull_request:
  workflow_dispatch:

env:
  # github.sha is the commit hash (hex only) — used only in artifact names.
  COMMIT_SHA: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 36 + build-tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintGenericRelease lintSupernoteRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Run unit tests
        run: ./gradlew testGenericDebugUnitTest testSupernoteDebugUnitTest --no-daemon --stacktrace

      - name: Assemble generic debug APK
        run: ./gradlew assembleGenericDebug --no-daemon --stacktrace

      - name: Assemble supernote debug APK
        run: ./gradlew assembleSupernoteDebug --no-daemon --stacktrace

      - name: Upload generic debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-generic-debug-${{ env.COMMIT_SHA }}
          path: app/build/outputs/apk/generic/debug/app-generic-debug.apk
          retention-days: 30

      - name: Upload supernote debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-supernote-debug-${{ env.COMMIT_SHA }}
          path: app/build/outputs/apk/supernote/debug/app-supernote-debug.apk
          retention-days: 30

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports-${{ env.COMMIT_SHA }}
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
