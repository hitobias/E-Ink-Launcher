name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true

env:
  # github.event.inputs.tag is user-supplied; github.ref_name is the tag from a push.
  # Use env layer so downstream run: blocks only see "$RELEASE_TAG" (no expression interpolation in shell).
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 36 + build-tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore (optional)
        # Set repo secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD to sign release builds.
        # Without them the release task signs with the debug keystore (acceptable for personal forks).
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > eink-launcher.jks
            {
              echo "storeFile=eink-launcher.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Release keystore configured."
          else
            echo "::warning::No KEYSTORE_BASE64 secret; release build will be unsigned."
          fi

      - name: Assemble both flavors (release)
        run: ./gradlew assembleGenericRelease assembleSupernoteRelease --no-daemon --stacktrace

      - name: Rename APKs with tag
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/generic/release/app-generic-release.apk \
             "release-assets/eink-launcher-$TAG-generic.apk"
          cp app/build/outputs/apk/supernote/release/app-supernote-release.apk \
             "release-assets/eink-launcher-$TAG-supernote.apk"
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release-assets/eink-launcher-${{ env.RELEASE_TAG }}-generic.apk
            release-assets/eink-launcher-${{ env.RELEASE_TAG }}-supernote.apk
