Summary: Minimal launcher optimized for e-ink readers
Description: |-
  E-Ink Launcher is a clean, minimal Android launcher designed for e-ink readers
  (Onyx Boox, Supernote, Pocketbook, Kindle Fire, etc.).

  Features:
  * Grid layout with adjustable density and font size
  * Built-in app search (long-press settings)
  * App folders (single-cell with composite icons)
  * Hide / sort apps; "Hidden Apps Manager" for bulk restore
  * One-tap lock screen / Wi-Fi / Bluetooth shortcuts
  * Bluetooth quick-connect with last-connected timestamps
  * Custom font (TTF) via SAF picker
  * Force language override (independent of system locale)
  * Settings export/import as JSON
  * Manifest app shortcuts (Lock / Search / Settings)
  * Auto periodic screen refresh to clear e-ink ghosting
  * Pin recently-used apps to top
  * Optional notification badges
  * Return-to-launcher persistent notification

  Two flavors:
  * generic — for any Android device
  * supernote — adds Chauvet OS internal-package filtering

